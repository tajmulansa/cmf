name: make-video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file to render"
        default: "scripts/example.txt"
  push:
    paths:
      - "scripts/**.txt"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick script
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.script }}" ]; then
            S="${{ github.event.inputs.script }}"
          else
            S=$(git diff --name-only HEAD^ HEAD -- 'scripts/*.txt' | head -1)
          fi
          [ -z "$S" ] && S="scripts/example.txt"
          echo "script=$S" >> "$GITHUB_OUTPUT"
          echo "Rendering $S"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System packages (ffmpeg + Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2

      - name: Python packages
        run: |
          pip install -r requirements.txt
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1

      - name: Download models (first run only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -L -o models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -L -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          [ -f models/planner.gguf ] || curl -L -o models/planner.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf

      - name: Script -> props.json (plan, voice, timings, images)
        env:
          LLM_PATH: models/planner.gguf
        run: python -m pipeline.run "${{ steps.pick.outputs.script }}"

      - name: Install renderer
        working-directory: remotion
        run: npm install

      - name: Render video
        working-directory: remotion
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/props.json
            out/credits.txt
          if-no-files-found: warn
